<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Selfie Partículas 3D - Câmera e Vídeo em Tempo Real</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: sans-serif;
            color: #fff;
            width: 100vw;
            height: 100vh;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #ui {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            z-index: 10;
            background: rgba(0, 0, 0, 0.75);
            padding: 12px 20px;
            border-radius: 30px;
            backdrop-filter: blur(5px);
            max-width: 95vw;
        }
        button {
            background: #ff3366;
            border: none;
            color: white;
            padding: 10px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 13px;
        }
        button:hover {
            background: #ff1144;
        }
        button.recording {
            background: #33cc66;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        #info {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            padding: 8px 18px;
            border-radius: 15px;
            font-size: 13px;
            text-align: center;
            max-width: 90vw;
            line-height: 1.4;
            z-index: 10;
            border: 1px solid rgba(255,255,255,0.2);
        }
        #error-box {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 25, 0.95);
            padding: 25px;
            border-radius: 12px;
            border: 2px solid #ff3366;
            text-align: center;
            z-index: 100;
            max-width: 80vw;
        }
    </style>
    <!-- Carregando p5.js via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
</head>
<body>
    <div id="info">Iniciando aplicação...</div>
    <div id="canvas-container"></div>
    <input type="file" id="videoUpload" accept="video/*" style="display: none;">
    <div id="error-box">
        <h3>Aviso de Câmera / Permissões</h3>
        <p id="error-msg">Verifique se o dispositivo possui a câmera selecionada ou se as permissões foram concedidas.</p>
        <button onclick="location.reload()">Tentar Novamente</button>
    </div>
    <div id="ui">
        <button id="toggleMode">Alternar Estilo</button>
        <button id="toggleCam">Trocar Câmera</button>
        <button id="importVideoBtn">Importar Vídeo</button>
        <button id="toggleRecord">Gravar Vídeo</button>
        <div style="display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 20px; font-size: 13px;">
            <span>Densidade:</span>
            <input type="range" id="densitySlider" min="20" max="100" value="50" step="5" style="accent-color: #ff3366; cursor: pointer; width: 90px;">
            <span id="densityVal" style="min-width: 45px; text-align: center;">50x38</span>
        </div>
        <div style="display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 20px; font-size: 13px;">
            <span>Tamanho:</span>
            <input type="range" id="sizeSlider" min="0" max="100" value="50" step="1" style="accent-color: #33cc66; cursor: pointer; width: 90px;">
            <span id="sizeVal" style="min-width: 40px; text-align: center;">50%</span>
        </div>
        <div style="display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 20px; font-size: 13px;">
            <span>Pinça Quadro:</span>
            <input type="checkbox" id="pinchModeToggle" style="accent-color: #33cc66; cursor: pointer; width: 16px; height: 16px;">
        </div>
    </div>

    <script>
        let cam;
        let customVideo = null;
        let isVideoSource = false;
        let particles = [];
        let cols = 50;
        let rows = 38;
        let videoReady = false;
        let mode = 0; // 0: Grid Partículas, 1: Partículas Livres Flutuantes
        let facingMode = 'environment';
        let particleSize = 1.0;
        let sceneZoom = 1.0;
        let prevPinchDist = null;

        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;
        let p5Canvas;
        let micStream;

        function setup() {
            p5Canvas = createCanvas(windowWidth, windowHeight, WEBGL);
            p5Canvas.parent('canvas-container');

            if (window.location.protocol === 'file:') {
                document.getElementById('error-msg').innerText = "Navegadores bloqueiam a câmera ao abrir arquivos locais (file://). Use via Servidor Local (http://localhost) ou importe um vídeo.";
                document.getElementById('error-box').style.display = 'block';
                document.getElementById('info').innerText = 'Modo arquivo local detectado. Use "Importar Vídeo".';
            }

            initCamera();

            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    particles.push(new Particle(x, y));
                }
            }

            document.getElementById('toggleMode').addEventListener('click', () => {
                mode = (mode + 1) % 2;
            });

            document.getElementById('toggleCam').addEventListener('click', () => {
                isVideoSource = false;
                if (customVideo) {
                    customVideo.pause();
                    customVideo.remove();
                    customVideo = null;
                }
                facingMode = (facingMode === 'user') ? 'environment' : 'user';
                initCamera();
            });

            document.getElementById('importVideoBtn').addEventListener('click', () => {
                document.getElementById('videoUpload').click();
            });

            document.getElementById('videoUpload').addEventListener('change', (e) => {
                let file = e.target.files[0];
                if (!file) return;

                let url = URL.createObjectURL(file);
                document.getElementById('info').innerText = 'Carregando vídeo...';

                if (cam && cam.elt && cam.elt.srcObject) {
                    let oldStream = cam.elt.srcObject;
                    oldStream.getTracks().forEach(track => track.stop());
                    cam.elt.srcObject = null;
                }

                if (customVideo) {
                    customVideo.remove();
                }

                videoReady = false;
                customVideo = createVideo(url, () => {
                    customVideo.loop();
                    customVideo.volume(0);
                    customVideo.play();
                    customVideo.size(cols, rows);
                    customVideo.hide();
                    isVideoSource = true;
                    videoReady = true;
                    document.getElementById('info').innerText = 'Vídeo importado ativo!';
                });
            });

            document.getElementById('toggleRecord').addEventListener('click', toggleRecording);

            document.getElementById('densitySlider').addEventListener('input', (e) => {
                let val = parseInt(e.target.value);
                cols = val;
                rows = Math.round(val * 0.76);
                document.getElementById('densityVal').innerText = `${cols}x${rows}`;
                
                if (isVideoSource && customVideo) {
                    customVideo.size(cols, rows);
                } else if (cam) {
                    cam.size(cols, rows);
                }

                particles = [];
                for (let y = 0; y < rows; y++) {
                    for (let x = 0; x < cols; x++) {
                        particles.push(new Particle(x, y));
                    }
                }
            });

            document.getElementById('sizeSlider').addEventListener('input', (e) => {
                let val = parseInt(e.target.value);
                if (val >= 50) {
                    particleSize = map(val, 50, 100, 1.0, 3.0);
                } else {
                    particleSize = map(val, 0, 50, 0.1, 1.0);
                }
                document.getElementById('sizeVal').innerText = `${val}%`;
            });
        }

        function initCamera() {
            document.getElementById('info').innerText = 'Iniciando câmera...';

            if (cam && cam.elt && cam.elt.srcObject) {
                let oldStream = cam.elt.srcObject;
                oldStream.getTracks().forEach(track => track.stop());
                cam.elt.srcObject = null;
            }

            let constraints = {
                video: {
                    facingMode: facingMode,
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                },
                audio: false
            };

            navigator.mediaDevices.getUserMedia(constraints)
                .then(stream => {
                    successStream(stream);
                })
                .catch(err => {
                    console.warn("Falha com facingMode:", facingMode, err);
                    if (facingMode === 'environment') {
                        facingMode = 'user';
                        constraints.video.facingMode = 'user';
                        navigator.mediaDevices.getUserMedia(constraints)
                            .then(stream => successStream(stream))
                            .catch(err2 => handleCameraError(err2));
                    } else {
                        handleCameraError(err);
                    }
                });
        }

        function successStream(stream) {
            if (!cam) {
                cam = createCapture({ video: true, audio: false }, function() {
                    videoReady = true;
                    document.getElementById('info').innerText = 'Câmera ativa! Toque em Gravar ou Importar Vídeo.';
                });
                cam.size(cols, rows);
                cam.hide();
            } else {
                videoReady = true;
                document.getElementById('info').innerText = 'Câmera ativa! Toque em Gravar ou Importar Vídeo.';
                cam.size(cols, rows);
            }
            cam.elt.srcObject = stream;
        }

        function handleCameraError(err) {
            console.error("Erro na câmera:", err);
            document.getElementById('error-box').style.display = 'block';
            document.getElementById('info').innerText = 'Câmera indisponível. Use "Importar Vídeo".';
        }

        async function toggleRecording() {
            if (!isRecording) {
                try {
                    recordedChunks = [];
                    micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false }).catch(e => null);
                    let canvasStream = p5Canvas.elt.captureStream(30);

                    let videoTracks = canvasStream.getVideoTracks();
                    let audioTracks = micStream ? micStream.getAudioTracks() : [];

                    let combinedStream = new MediaStream([...videoTracks, ...audioTracks]);

                    let options = { mimeType: 'video/webm;codecs=vp9,opus' };
                    if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                        options = { mimeType: 'video/webm' };
                    }
                    if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                        options = { mimeType: '' };
                    }

                    mediaRecorder = new MediaRecorder(combinedStream, options);

                    mediaRecorder.ondataavailable = function(e) {
                        if (e.data && e.data.size > 0) {
                            recordedChunks.push(e.data);
                        }
                    };

                    mediaRecorder.onstop = function() {
                        let blob = new Blob(recordedChunks, { type: 'video/webm' });
                        let url = URL.createObjectURL(blob);
                        let a = document.createElement('a');
                        a.style.display = 'none';
                        a.href = url;
                        a.download = 'selfie-particles-3d-' + Date.now() + '.webm';
                        document.body.appendChild(a);
                        a.click();
                        setTimeout(() => {
                            document.body.removeChild(a);
                            window.URL.revokeObjectURL(url);
                        }, 100);

                        if (micStream) {
                            micStream.getTracks().forEach(track => track.stop());
                        }

                        document.getElementById('info').innerText = 'Vídeo salvo!';
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    let btn = document.getElementById('toggleRecord');
                    btn.innerText = 'Parar Gravação';
                    btn.classList.add('recording');
                    document.getElementById('info').innerText = 'Gravando...';

                } catch (err) {
                    console.error("Erro ao gravar:", err);
                    alert("Erro ao gravar: " + err.message);
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                let btn = document.getElementById('toggleRecord');
                btn.innerText = 'Gravar Vídeo';
                btn.classList.remove('recording');
            }
        }

        function draw() {
            background(10, 10, 15);

            let activeSource = isVideoSource ? customVideo : cam;
            if (!videoReady || !activeSource) {
                return;
            }

            try {
                activeSource.loadPixels();
                if (!activeSource.pixels || activeSource.pixels.length === 0) return;
            } catch (e) {
                return;
            }

            let rx = map(mouseY, 0, height, -0.5, 0.5);
            let ry = map(mouseX, 0, width, -0.5, 0.5);
            
            if (touches.length === 1) {
                rx = map(touches[0].y, 0, height, -0.5, 0.5);
                ry = map(touches[0].x, 0, width, -0.5, 0.5);
            } else if (touches.length === 2) {
                let currentDist = dist(touches[0].x, touches[0].y, touches[1].x, touches[1].y);
                if (prevPinchDist !== null) {
                    let ratio = currentDist / prevPinchDist;
                    let pinchToggle = document.getElementById('pinchModeToggle');
                    if (pinchToggle && pinchToggle.checked) {
                        sceneZoom = constrain(sceneZoom * ratio, 0.2, 5.0);
                    }
                }
                prevPinchDist = currentDist;
            } else {
                prevPinchDist = null;
            }

            rotateX(rx);
            rotateY(ry);
            scale(sceneZoom);

            let spacingX = width / cols;
            let spacingY = height / rows;

            translate(-width / 2 + spacingX / 2, -height / 2 + spacingY / 2, 0);

            let index = 0;
            noStroke();
            for (let y = 0; y < rows; y++) {
                let baseY = y * spacingY;
                for (let x = 0; x < cols; x++) {
                    let camX = (!isVideoSource && facingMode === 'user') ? (cols - 1 - x) : x;
                    let loc = (camX + y * cols) * 4;

                    let r = activeSource.pixels[loc] || 0;
                    let g = activeSource.pixels[loc + 1] || 0;
                    let b = activeSource.pixels[loc + 2] || 0;
                    let bright = (r + g + b) / 3;

                    let p = particles[index];
                    p.update(bright, r, g, b);
                    
                    let baseX = x * spacingX;
                    let pz = p.z + (mode === 1 ? p.floatZ : 0);
                    
                    translate(baseX, baseY, pz);
                    fill(p.r, p.g, p.b, 220);
                    
                    let sz = (1 + (p.bright / 255) * 4) * particleSize;

                    if (mode === 0) {
                        box(sz * 2);
                    } else {
                        sphere(sz * 1.5, 4, 4);
                    }
                    translate(-baseX, -baseY, -pz);

                    index++;
                }
            }
        }

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.offset = random(1000);
                this.z = 0;
                this.floatZ = 0;
                this.bright = 0;
                this.r = 255;
                this.g = 255;
                this.b = 255;
            }

            update(bright, r, g, b) {
                this.bright = bright;
                this.r = r;
                this.g = g;
                this.b = b;

                let targetZ = (bright * 240 / 255) - 120;
                this.z += (targetZ - this.z) * 0.2;

                let angle = millis() * 0.003 + this.offset;
                this.floatZ = sin(angle) * 12;
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
